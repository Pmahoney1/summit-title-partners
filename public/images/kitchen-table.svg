<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#faf7f2"/>
      <stop offset="45%" stop-color="#f0ebe2"/>
      <stop offset="100%" stop-color="#e0d4c0"/>
    </linearGradient>
    <linearGradient id="tableTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c8b5"/>
      <stop offset="100%" stop-color="#b8aa95"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#faf7f2" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#faf7f2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#faf7f2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf7f2"/>
      <stop offset="100%" stop-color="#f0ebe2"/>
    </linearGradient>
    <linearGradient id="paper2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6b5d4e" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Room background — warm gradient suggesting window light from right -->
  <rect width="800" height="600" fill="url(#room)"/>

  <!-- Window light wash from right -->
  <rect width="800" height="600" fill="url(#windowLight)"/>

  <!-- Subtle wall / floor divide -->
  <rect x="0" y="300" width="800" height="300" fill="#c4b8a2" opacity="0.15"/>
  <line x1="0" y1="302" x2="800" y2="302" stroke="#a08050" stroke-width="1.5" opacity="0.25"/>

  <!-- Table surface -->
  <ellipse cx="400" cy="520" rx="340" ry="60" fill="#8b6e45" opacity="0.4"/>
  <rect x="100" y="320" width="600" height="200" rx="8" fill="url(#tableTop)" filter="url(#softShadow)"/>
  <rect x="100" y="320" width="600" height="12" rx="8" fill="#e8dfd0" opacity="0.5"/>

  <!-- Paper stack — slightly rotated, back -->
  <g transform="rotate(-4, 310, 400)">
    <rect x="220" y="340" width="180" height="240" rx="3" fill="url(#paper2)" filter="url(#softShadow)"/>
    <!-- Ruled lines -->
    <line x1="236" y1="380" x2="384" y2="380" stroke="#c4b8a2" stroke-width="1.5" opacity="0.6"/>
    <line x1="236" y1="398" x2="384" y2="398" stroke="#c4b8a2" stroke-width="1.5" opacity="0.6"/>
    <line x1="236" y1="416" x2="384" y2="416" stroke="#c4b8a2" stroke-width="1.5" opacity="0.6"/>
    <line x1="236" y1="434" x2="384" y2="434" stroke="#c4b8a2" stroke-width="1.5" opacity="0.6"/>
    <line x1="236" y1="452" x2="360" y2="452" stroke="#c4b8a2" stroke-width="1.5" opacity="0.6"/>
    <!-- Stamp mark -->
    <rect x="330" y="510" width="60" height="30" rx="2" fill="none" stroke="#1a2744" stroke-width="1.5" opacity="0.3"/>
    <rect x="336" y="516" width="48" height="6" rx="1" fill="#1a2744" opacity="0.15"/>
    <rect x="336" y="526" width="36" height="6" rx="1" fill="#1a2744" opacity="0.15"/>
  </g>

  <!-- Main paper — front, slightly rotated other way -->
  <g transform="rotate(3, 420, 400)">
    <rect x="300" y="330" width="200" height="260" rx="3" fill="url(#paper1)" filter="url(#softShadow)"/>
    <!-- Text-line simulation -->
    <line x1="318" y1="370" x2="482" y2="370" stroke="#6b5d4e" stroke-width="1.5" opacity="0.4"/>
    <line x1="318" y1="390" x2="482" y2="390" stroke="#6b5d4e" stroke-width="1.5" opacity="0.4"/>
    <line x1="318" y1="410" x2="460" y2="410" stroke="#6b5d4e" stroke-width="1.5" opacity="0.4"/>
    <line x1="318" y1="430" x2="482" y2="430" stroke="#6b5d4e" stroke-width="1.5" opacity="0.4"/>
    <line x1="318" y1="450" x2="440" y2="450" stroke="#6b5d4e" stroke-width="1.5" opacity="0.4"/>
    <!-- Signature line -->
    <line x1="318" y1="530" x2="440" y2="530" stroke="#1a2744" stroke-width="1" opacity="0.3"/>
    <path d="M322 526 Q335 520 348 526 Q355 530 365 524" stroke="#1a2744" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round"/>
    <!-- Gold accent tab -->
    <rect x="460" y="330" width="40" height="16" rx="0" fill="#c4a265" opacity="0.7"/>
  </g>

  <!-- Glasses — circle shapes -->
  <circle cx="570" cy="390" r="38" fill="none" stroke="#6b5d4e" stroke-width="4" opacity="0.5"/>
  <circle cx="640" cy="385" r="38" fill="none" stroke="#6b5d4e" stroke-width="4" opacity="0.5"/>
  <line x1="608" y1="390" x2="602" y2="388" stroke="#6b5d4e" stroke-width="4" opacity="0.5"/>
  <!-- Lens glare -->
  <circle cx="555" cy="375" r="6" fill="#faf7f2" opacity="0.4"/>
  <circle cx="625" cy="370" r="6" fill="#faf7f2" opacity="0.4"/>
  <!-- Arm -->
  <line x1="678" y1="385" x2="720" y2="370" stroke="#6b5d4e" stroke-width="4" opacity="0.5" stroke-linecap="round"/>

  <!-- Coffee mug (circle + handle) -->
  <rect x="146" y="356" width="68" height="80" rx="8" fill="#e8dfd0" opacity="0.9"/>
  <rect x="150" y="360" width="60" height="72" rx="6" fill="#faf7f2" opacity="0.5"/>
  <path d="M214 378 Q236 378 236 396 Q236 414 214 414" stroke="#d4c8b5" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Coffee surface -->
  <ellipse cx="180" cy="364" rx="30" ry="8" fill="#8b6e45" opacity="0.4"/>

  <!-- Pen -->
  <rect x="480" y="455" width="200" height="8" rx="4" fill="#1a2744" opacity="0.55" transform="rotate(-12, 480, 455)"/>
  <rect x="664" y="420" width="14" height="8" rx="2" fill="#c4a265" opacity="0.8" transform="rotate(-12, 480, 455)"/>
</svg>
