<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a265"/>
      <stop offset="100%" stop-color="#8b6e45"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3d5e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dfd0"/>
      <stop offset="100%" stop-color="#d4c8b5"/>
    </linearGradient>
    <linearGradient id="lightSpill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#faf7f2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#faf7f2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plantShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3f33"/>
      <stop offset="100%" stop-color="#6b5d4e"/>
    </linearGradient>
    <radialGradient id="knob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#faf7f2"/>
      <stop offset="100%" stop-color="#c4a265"/>
    </radialGradient>
  </defs>

  <!-- Background wall — warm brick tone -->
  <rect width="800" height="600" fill="url(#wall)"/>

  <!-- Subtle wall texture bands -->
  <rect x="0" y="0" width="800" height="12" fill="#1a2744" opacity="0.04"/>
  <rect x="0" y="24" width="800" height="12" fill="#1a2744" opacity="0.04"/>
  <rect x="0" y="48" width="800" height="12" fill="#1a2744" opacity="0.04"/>
  <rect x="0" y="72" width="800" height="12" fill="#1a2744" opacity="0.04"/>
  <rect x="0" y="96" width="800" height="12" fill="#1a2744" opacity="0.04"/>
  <rect x="0" y="120" width="800" height="12" fill="#1a2744" opacity="0.04"/>
  <rect x="0" y="144" width="800" height="12" fill="#1a2744" opacity="0.04"/>
  <rect x="0" y="168" width="800" height="12" fill="#1a2744" opacity="0.04"/>
  <rect x="0" y="192" width="800" height="12" fill="#1a2744" opacity="0.04"/>
  <rect x="0" y="216" width="800" height="12" fill="#1a2744" opacity="0.04"/>
  <rect x="0" y="240" width="800" height="12" fill="#1a2744" opacity="0.04"/>
  <rect x="0" y="264" width="800" height="12" fill="#1a2744" opacity="0.04"/>
  <rect x="0" y="288" width="800" height="12" fill="#1a2744" opacity="0.04"/>
  <rect x="0" y="312" width="800" height="12" fill="#1a2744" opacity="0.04"/>
  <rect x="0" y="336" width="800" height="12" fill="#1a2744" opacity="0.04"/>
  <rect x="0" y="360" width="800" height="12" fill="#1a2744" opacity="0.04"/>

  <!-- Porch floor -->
  <rect x="0" y="480" width="800" height="120" fill="url(#floorGrad)"/>
  <!-- Floor planks -->
  <line x1="0" y1="500" x2="800" y2="500" stroke="#c4a265" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#c4a265" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="540" x2="800" y2="540" stroke="#c4a265" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="560" x2="800" y2="560" stroke="#c4a265" stroke-width="1" opacity="0.3"/>

  <!-- Door frame (trim) -->
  <rect x="286" y="118" width="228" height="364" rx="2" fill="#faf7f2"/>

  <!-- Door panel -->
  <rect x="298" y="130" width="204" height="352" rx="2" fill="url(#doorGrad)"/>

  <!-- Door panels — upper two -->
  <rect x="312" y="148" width="80" height="100" rx="3" fill="#1a2744" stroke="#2d3d5e" stroke-width="1.5"/>
  <rect x="408" y="148" width="80" height="100" rx="3" fill="#1a2744" stroke="#2d3d5e" stroke-width="1.5"/>

  <!-- Door panels — lower two -->
  <rect x="312" y="262" width="80" height="180" rx="3" fill="#1a2744" stroke="#2d3d5e" stroke-width="1.5"/>
  <rect x="408" y="262" width="80" height="180" rx="3" fill="#1a2744" stroke="#2d3d5e" stroke-width="1.5"/>

  <!-- Door knob -->
  <circle cx="486" cy="388" r="9" fill="url(#knob)"/>
  <circle cx="486" cy="388" r="4" fill="#c4a265"/>

  <!-- Light spilling from above door -->
  <rect x="298" y="130" width="204" height="352" fill="url(#lightSpill)"/>

  <!-- Overhead light fixture -->
  <rect x="386" y="100" width="28" height="18" rx="9" fill="#e8dfd0"/>
  <rect x="393" y="118" width="14" height="6" fill="#d4c8b5"/>

  <!-- Plant pot — right of door -->
  <ellipse cx="570" cy="482" rx="28" ry="10" fill="#6b5d4e"/>
  <rect x="546" y="440" width="48" height="44" rx="4" fill="#6b5d4e"/>
  <rect x="550" y="436" width="40" height="8" rx="2" fill="#8b6e45"/>
  <!-- Plant stems -->
  <path d="M568 438 Q558 400 548 370" stroke="#4a3f33" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M572 435 Q585 395 578 360" stroke="#4a3f33" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M566 440 Q545 415 538 395" stroke="#4a3f33" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Leaf masses -->
  <ellipse cx="545" cy="365" rx="18" ry="12" fill="#3a4a30" opacity="0.85"/>
  <ellipse cx="560" cy="350" rx="22" ry="14" fill="#4a5a3a" opacity="0.85"/>
  <ellipse cx="578" cy="355" rx="16" ry="11" fill="#3a4a30" opacity="0.85"/>
  <ellipse cx="536" cy="388" rx="14" ry="10" fill="#4a5a3a" opacity="0.7"/>

  <!-- Step -->
  <rect x="240" y="476" width="320" height="16" rx="2" fill="#d4c8b5"/>
  <rect x="240" y="490" width="320" height="6" fill="#c4b8a2" opacity="0.5"/>
</svg>
