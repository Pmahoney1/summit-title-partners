<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#2d3d5e"/>
    </linearGradient>
    <linearGradient id="leftShape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfd0"/>
      <stop offset="100%" stop-color="#c4b8a2"/>
    </linearGradient>
    <linearGradient id="rightShape" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dfd0"/>
      <stop offset="100%" stop-color="#c4b8a2"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a08050"/>
      <stop offset="50%" stop-color="#c4a265"/>
      <stop offset="100%" stop-color="#a08050"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4a265" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c4a265" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Subtle radial glow at center -->
  <ellipse cx="400" cy="300" rx="300" ry="220" fill="url(#centerGlow)"/>

  <!-- Fine grid texture suggestion -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#faf7f2" stroke-width="0.5" opacity="0.04"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#faf7f2" stroke-width="0.5" opacity="0.04"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#faf7f2" stroke-width="0.5" opacity="0.04"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#faf7f2" stroke-width="0.5" opacity="0.04"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#faf7f2" stroke-width="0.5" opacity="0.04"/>
  <line x1="160" y1="0" x2="160" y2="600" stroke="#faf7f2" stroke-width="0.5" opacity="0.04"/>
  <line x1="320" y1="0" x2="320" y2="600" stroke="#faf7f2" stroke-width="0.5" opacity="0.04"/>
  <line x1="480" y1="0" x2="480" y2="600" stroke="#faf7f2" stroke-width="0.5" opacity="0.04"/>
  <line x1="640" y1="0" x2="640" y2="600" stroke="#faf7f2" stroke-width="0.5" opacity="0.04"/>

  <!-- Left arm shape — sweeping wedge coming from left -->
  <path d="M-20 420 L260 240 Q320 210 360 260 L380 290 Q340 310 300 340 Q260 370 200 390 Z"
        fill="url(#leftShape)" opacity="0.9"/>

  <!-- Right arm shape — sweeping wedge coming from right -->
  <path d="M820 420 L540 240 Q480 210 440 260 L420 290 Q460 310 500 340 Q540 370 600 390 Z"
        fill="url(#rightShape)" opacity="0.9"/>

  <!-- Gold overlap band — the meeting point -->
  <path d="M340 252 Q370 230 400 245 Q430 230 460 252 L480 290 Q450 320 420 310 Q400 330 380 310 Q350 320 320 290 Z"
        fill="url(#goldAccent)" opacity="0.95"/>

  <!-- Gold connection highlight line -->
  <path d="M340 252 Q370 230 400 245 Q430 230 460 252"
        stroke="#faf7f2" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round"/>

  <!-- Bright center point — the handshake nexus -->
  <circle cx="400" cy="270" r="18" fill="#c4a265" opacity="0.9" filter="url(#glow)"/>
  <circle cx="400" cy="270" r="8" fill="#faf7f2" opacity="0.8"/>

  <!-- Concentric ring echoes from center -->
  <circle cx="400" cy="270" r="40" fill="none" stroke="#c4a265" stroke-width="1.5" opacity="0.3"/>
  <circle cx="400" cy="270" r="70" fill="none" stroke="#c4a265" stroke-width="1" opacity="0.18"/>
  <circle cx="400" cy="270" r="110" fill="none" stroke="#c4a265" stroke-width="0.75" opacity="0.1"/>

  <!-- Light edge strokes on shapes for depth -->
  <path d="M-20 420 L260 240 Q320 210 360 260"
        stroke="#faf7f2" stroke-width="1.5" fill="none" opacity="0.2" stroke-linecap="round"/>
  <path d="M820 420 L540 240 Q480 210 440 260"
        stroke="#faf7f2" stroke-width="1.5" fill="none" opacity="0.2" stroke-linecap="round"/>

  <!-- Minimal wordmark area hint — two small dots below suggesting symmetry -->
  <circle cx="372" cy="420" r="4" fill="#c4a265" opacity="0.5"/>
  <circle cx="428" cy="420" r="4" fill="#c4a265" opacity="0.5"/>
  <line x1="376" y1="420" x2="424" y2="420" stroke="#c4a265" stroke-width="1" opacity="0.3"/>
</svg>
